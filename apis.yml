name: Giftcard Zen
description: 'Giftcard Zen was a secondary gift-card marketplace founded in 2012 by Aaron Dragushan
  in Phoenix, Arizona, that let consumers sell unwanted gift cards for cash and buy discounted
  gift cards from retailers such as Target, Home Depot, Lowe''s, Walmart and Best Buy. Backed by
  500 Global, the company was acquired by RetailMeNot in April 2016 for roughly $22 million in cash
  (plus an earnout) and folded into RetailMeNot''s digital savings platform. The giftcardzen.com
  domain no longer operates as an independent service and redirects to RetailMeNot; the company
  exposes no public developer or API surface. This profile is retained for network provenance.'
